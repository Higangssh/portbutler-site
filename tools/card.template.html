<!doctype html><meta charset=utf-8><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden}
body{background:#0f1418;color:#e9eef3;
     font:16px/1.5 -apple-system,"SF Pro Text",system-ui,sans-serif;
     -webkit-font-smoothing:antialiased;position:relative}
.glow{position:absolute;left:-140px;top:-180px;width:900px;height:700px;
      background:radial-gradient(ellipse at center,#4fb3a528,transparent 62%)}
.pad{position:relative;padding:62px 0 0 68px;width:640px}
.eye{font-size:15px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:#4fb3a5}
h1{font-size:74px;line-height:.98;letter-spacing:-.032em;font-weight:750;margin-top:22px}
h1 em{font-style:normal;color:#4fb3a5}
p{margin-top:26px;font-size:23px;line-height:1.42;color:#9aa9b6;max-width:16.5em}
.foot{position:absolute;left:68px;bottom:52px;display:flex;align-items:center;gap:15px}
.foot img{width:50px;height:50px}
.foot b{font-size:22px;font-weight:700}
.foot span{color:#6b7b89;font-size:19px}
.pill{margin-left:6px;padding:7px 15px;border:1px solid #33424e;border-radius:999px;
      font-size:17px;color:#9aa9b6}
.shot{position:absolute;right:-305px;top:112px;width:950px;border-radius:14px;
      border:1px solid #ffffff1f;box-shadow:0 40px 90px #0008}
</style>
<div class=glow></div>
<img class=shot src="{{SHOT}}">
<div class=pad>
  <div class=eye>macOS · SSH · SFTP · Serial</div>
  <h1>Three of them.<br><em>One window.</em></h1>
  <p>A terminal, a file manager and a serial monitor — for one machine.</p>
</div>
<div class=foot>
  <img src="{{ICON}}"><b>PortButler</b>
  <span>portbutler.sshlab.dev</span>
  <span class=pill>Free for 14 days · $29 once</span>
</div>
